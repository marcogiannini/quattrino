[package]
name = "quattrino"
version = "0.2.0"
description = "Quattrino — gestione delle spese personali"
edition = "2021"
rust-version = "1.77"

[lib]
name = "quattrino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
